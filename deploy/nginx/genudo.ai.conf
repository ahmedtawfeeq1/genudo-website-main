# GenuDo website: nginx in front of the Docker container (127.0.0.1:3000).
# Install: copy to /etc/nginx/sites-available/genudo.ai, symlink into sites-enabled,
# keep the certificate paths your current config uses, then: sudo nginx -t && sudo systemctl reload nginx

upstream genudo_web { server 127.0.0.1:3000; keepalive 32; }

# HTTP -> HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name genudo.ai www.genudo.ai;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }   # certbot renewals
  location / { return 301 https://genudo.ai$request_uri; }
}

# www -> apex
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.genudo.ai;
  ssl_certificate     /etc/letsencrypt/live/genudo.ai/fullchain.pem;   # <- keep your current paths
  ssl_certificate_key /etc/letsencrypt/live/genudo.ai/privkey.pem;
  return 301 https://genudo.ai$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name genudo.ai;
  ssl_certificate     /etc/letsencrypt/live/genudo.ai/fullchain.pem;   # <- keep your current paths
  ssl_certificate_key /etc/letsencrypt/live/genudo.ai/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  # Forms endpoint: small bodies only (the app also caps at 32 KB).
  location = /api/forms {
    client_max_body_size 64k;
    proxy_pass http://genudo_web;
    include /etc/nginx/snippets/genudo-proxy.conf;
  }

  # Hashed build assets never change: cache for a year.
  location /_next/static/ {
    proxy_pass http://genudo_web;
    include /etc/nginx/snippets/genudo-proxy.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://genudo_web;
    include /etc/nginx/snippets/genudo-proxy.conf;
  }
}
