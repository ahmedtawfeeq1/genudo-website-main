# GenuDo website behind Cloudflare (Cloudflare terminates HTTPS; origin nginx on :80).
# Container: 127.0.0.1:3001. Requires /etc/nginx/conf.d/genudo-cloudflare.conf
# (deploy/nginx/install-cloudflare-realip.sh) and /etc/nginx/snippets/genudo-proxy.conf.
# Do NOT add an http->https redirect here: with Cloudflare "Flexible" SSL it loops.

upstream genudo_web { server 127.0.0.1:3001; keepalive 16; }

server {
  listen 80;
  server_name www.genudo.ai;
  return 301 https://genudo.ai$request_uri;
}

server {
  listen 80;
  server_name genudo.ai;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  # Forms endpoint: small bodies only (the app also caps at 32 KB).
  location = /api/forms {
    client_max_body_size 64k;
    proxy_pass http://genudo_web;
    include /etc/nginx/snippets/genudo-proxy.conf;
  }

  # Hashed build assets never change.
  location /_next/static/ {
    proxy_pass http://genudo_web;
    include /etc/nginx/snippets/genudo-proxy.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://genudo_web;
    include /etc/nginx/snippets/genudo-proxy.conf;
  }
}
