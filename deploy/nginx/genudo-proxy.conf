# Shared proxy headers. Copy to /etc/nginx/snippets/genudo-proxy.conf
# Needs the $genudo_fwd_proto map from /etc/nginx/conf.d/genudo-cloudflare.conf.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# The forms rate limit trusts ONLY this header. With real_ip (conf.d) $remote_addr is
# the visitor's IP for Cloudflare traffic and the connecting IP for anything else.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# Cloudflare sends https here; keeps Next.js redirects on https.
proxy_set_header X-Forwarded-Proto $genudo_fwd_proto;
proxy_read_timeout 30s;
