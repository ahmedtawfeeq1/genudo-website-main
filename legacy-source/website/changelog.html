<script>
(function(){
  var ICON={chart:'<path d="M3 3v18h18"/><path d="m7 14 3-3 3 3 4-5"/>',ops:'<circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/>',cpu:'<rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>',msg:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',bolt:'<path d="M13 2 3 14h7l-1 8 10-12h-7z"/>'};
  var data=JSON.parse(document.getElementById('changelog-data').textContent);
  var cats=['All'].concat([].concat.apply([],[]).concat(Array.from(new Set(data.map(function(d){return d.cat;})))));
  var listEl=document.getElementById('clogList'), filtEl=document.getElementById('clogFilters');
  var active='All';
  function svg(n){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(ICON[n]||ICON.bolt)+'</svg>';}
  function slug(t){return t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
  function render(){
    filtEl.innerHTML=cats.map(function(c){return '<button class="clog-filter'+(c===active?' on':'')+'" data-c="'+c+'">'+c+'</button>';}).join('');
    listEl.innerHTML=data.filter(function(d){return active==='All'||d.cat===active;}).map(function(d){
      var tags=d.tags.map(function(t){return '<span class="clog-tag '+t+'">'+t+'</span>';}).join('');
      var list=d.list?('<ul>'+d.list.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>'):'';
      return '<article class="clog-item" id="'+slug(d.title)+'">'+
        '<div class="clog-date">'+d.date+'</div>'+
        '<div class="clog-cover" style="background:'+d.grad+'"><span class="cc-tag">'+d.cat+'</span><span class="cc-ic">'+svg(d.icon)+'</span><span class="cc-h">'+d.cover+'</span></div>'+
        '<div class="clog-tags">'+tags+'</div>'+
        '<h3>'+d.title+'</h3><p>'+d.body+'</p>'+list+'</article>';
    }).join('');
    if(location.hash){var el=document.getElementById(location.hash.slice(1)); if(el) window.scrollTo(0, el.getBoundingClientRect().top+window.scrollY-84);}
  }
  filtEl.addEventListener('click',function(e){var b=e.target.closest('[data-c]'); if(!b)return; active=b.dataset.c; render();});
  render();
})();
</script>
