  {"slug":"blog-launch-analytics-center","cat":"Company","title":"Introducing the Analytics Center","excerpt":"See what your whole AI workforce produces — outcomes, workload and cost, by channel and by agent, in one place.","grad":"linear-gradient(135deg,#1e293b,#4338ca)","coverTitle":"New: <span class=\"a\">Analytics Center</span>","author":"YE","authorName":"Yasser El-Sayed","date":"May 30, 2026","read":"4 min"},
  {"slug":"blog-guardrails-that-matter","cat":"Insights","title":"The guardrails that actually matter for customer-facing AI","excerpt":"Human-in-the-loop, on-policy answers, and knowing when to escalate. A practical guide to shipping agents you can trust with real customers.","grad":"linear-gradient(135deg,#0ea5e9,#06b6d4)","coverTitle":"Guardrails <span class=\"a\">that matter</span>","author":"MA","authorName":"Mariam Adel","date":"May 18, 2026","read":"8 min"}

<script>
(function(){
  var data=JSON.parse(document.getElementById('blog-data').textContent);
  var cats=['All'].concat(Array.from(new Set(data.map(function(d){return d.cat;}))));
  var grid=document.getElementById('blogGrid'), catEl=document.getElementById('blogCats'), search=document.getElementById('blogSearch');
  var active='All', q='';
  function render(){
    catEl.innerHTML=cats.map(function(c){return '<button class="blog-cat'+(c===active?' on':'')+'" data-c="'+c+'">'+c+'</button>';}).join('');
    var items=data.filter(function(d){
      var okCat=active==='All'||d.cat===active;
      var okQ=!q||(d.title+' '+d.excerpt+' '+d.cat).toLowerCase().indexOf(q)>-1;
      return okCat&&okQ;
    });
    grid.innerHTML=items.length?items.map(function(d){
      return '<a class="pcard" href="'+d.slug+'.html">'+
        '<div class="pcover" style="background:'+d.grad+'"><span class="pc-title">'+d.coverTitle+'</span></div>'+
        '<div class="pc-body"><div class="pc-cat">'+d.cat+'</div><h3>'+d.title+'</h3><p>'+d.excerpt+'</p>'+
        '<div class="pc-meta"><span class="av">'+d.author+'</span>'+d.authorName+'<span class="dot"></span>'+d.date+'<span class="dot"></span>'+d.read+'</div></div></a>';
    }).join('') : '<p style="color:var(--ink-3)">No articles match your search.</p>';
  }
  catEl.addEventListener('click',function(e){var b=e.target.closest('[data-c]'); if(!b)return; active=b.dataset.c; render();});
  search.addEventListener('input',function(){q=search.value.trim().toLowerCase(); render();});
  render();
})();
</script>
